name: Build LineageOS 18.1 for SM-G9350

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'userdebug'
        type: choice
        options:
          - userdebug
          - user

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential \
            zip curl zlib1g-dev libc6-dev-i386 \
            libncurses5 x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils \
            xsltproc unzip fontconfig python3 \
            python-is-python3 bc lzop ccache \
            libssl-dev repo

      - name: Configure git
        run: |
          git config --global user.email "build@github.com"
          git config --global user.name "GitHub Actions"
          git config --global color.ui false

      - name: Initialize repo
        run: |
          mkdir -p $HOME/android/lineage
          cd $HOME/android/lineage
          repo init \
            -u https://github.com/LineageOS/android.git \
            -b lineage-18.1 \
            --depth=1 \
            --groups=default,-mips,-darwin,-notdefault

      - name: Create local manifest
        run: |
          mkdir -p $HOME/android/lineage/.repo/local_manifests
          cat > $HOME/android/lineage/.repo/local_manifests/hero2qltechn.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <!-- Device tree -->
            <project
              path="device/samsung/hero2qltechn"
              name="trixstuffs/lineage_android_device_samsung_hero2qltechn"
              remote="github"
              revision="lineage-18.1" />

            <!-- Vendor blobs (full Samsung vendor) -->
            <project
              path="vendor/samsung"
              name="TheMuppets/proprietary_vendor_samsung"
              remote="github"
              revision="lineage-18.1" />
          </manifest>
          EOF

      - name: Sync source
        run: |
          cd $HOME/android/lineage
          repo sync \
            -c \
            -j$(nproc) \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune

- name: Clone kernel source
        run: |
          mkdir -p $HOME/android/lineage/kernel/samsung
          git clone --depth=1 \
            https://github.com/LineageOS/android_kernel_samsung_msm8996 \
            $HOME/android/lineage/kernel/samsung/msm8996
          mkdir -p $HOME/android/lineage/device/samsung/hero2qltechn/prebuilt
          cp $HOME/android/lineage/kernel/samsung/msm8996/arch/arm64/configs/lineage_hero2qltechn_defconfig \
            $HOME/android/lineage/device/samsung/hero2qltechn/prebuilt/kernel 2>/dev/null || true

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-hero2qltechn-${{ github.sha }}
          restore-keys: |
            ccache-hero2qltechn-

      - name: Build LineageOS 18.1
        run: |
          cd $HOME/android/lineage
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR=$HOME/.ccache
          ccache -M 10G
          export ALLOW_MISSING_DEPENDENCIES=true
          rm -rf $HOME/android/lineage/hardware/qcom-caf/msm8996/display
          source build/envsetup.sh
          breakfast hero2qltechn ${{ github.event.inputs.build_type }}
          mka bacon -j$(nproc)

      - name: Upload ROM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-18.1-hero2qltechn-${{ github.run_number }}
          path: |
            ${{ env.HOME }}/android/lineage/out/target/product/hero2qltechn/lineage-*.zip
            ${{ env.HOME }}/android/lineage/out/target/product/hero2qltechn/recovery.img
          retention-days: 7

      - name: Upload error log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-log-${{ github.run_number }}
          path: ${{ env.HOME }}/android/lineage/out/error.log
          retention-days: 3
