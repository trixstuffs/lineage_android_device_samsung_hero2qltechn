name: Build LineageOS 17.1 for SM-G9350

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'userdebug'
        type: choice
        options:
          - userdebug
          - user

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get clean
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential \
            zip curl zlib1g-dev libc6-dev-i386 \
            libncurses5 x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils \
            xsltproc unzip fontconfig python3 \
            python-is-python3 bc lzop ccache \
            libssl-dev repo

      - name: Configure git
        run: |
          git config --global user.email "build@github.com"
          git config --global user.name "GitHub Actions"
          git config --global color.ui false

      - name: Initialize repo
        run: |
          mkdir -p $HOME/android/lineage
          cd $HOME/android/lineage
          repo init \
            -u https://github.com/LineageOS/android.git \
            -b lineage-17.1 \
            --depth=1 \
            --groups=default,-mips,-darwin,-notdefault

      - name: Create local manifest
        run: |
          mkdir -p $HOME/android/lineage/.repo/local_manifests
          cat > $HOME/android/lineage/.repo/local_manifests/hero2qltechn.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <!-- Device tree -->
            <project
              path="device/samsung/hero2qltechn"
              name="trixstuffs/lineage_android_device_samsung_hero2qltechn"
              remote="github"
              revision="lineage-17.1" />

            <!-- Vendor blobs (full Samsung vendor) -->
            <project
              path="vendor/samsung"
              name="TheMuppets/proprietary_vendor_samsung"
              remote="github"
              revision="lineage-17.1" />
          </manifest>
          EOF

      - name: Sync source
        run: |
          cd $HOME/android/lineage
          repo sync \
            -c \
            -j$(nproc) \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune


      - name: Setup kernel headers and prebuilt
        run: |
          mkdir -p $HOME/android/lineage/kernel/samsung/msm8996/include/linux
          mkdir -p $HOME/android/lineage/kernel/samsung/msm8996/arch/arm64/configs
          mkdir -p $HOME/android/lineage/kernel/samsung/msm8996/scripts
          printf 'SBOX_OUT := $(O)\nheaders_install:\n\tmkdir -p $(SBOX_OUT)/usr/include/sound\n\ttouch $(SBOX_OUT)/usr/include/sound/audio_effects.h\n\tmkdir -p $(SBOX_OUT)/usr/include/linux\n\ttouch $(SBOX_OUT)/usr/include/linux/msm_kgsl.h\n\ttouch $(SBOX_OUT)/usr/include/linux/msm_audio_calibration.h\n%%:\n\t@true\n.DEFAULT_GOAL := all\n' > $HOME/android/lineage/kernel/samsung/msm8996/Makefile
          touch $HOME/android/lineage/kernel/samsung/msm8996/arch/arm64/configs/lineage_hero2qltechn_defconfig
          touch $HOME/android/lineage/kernel/samsung/msm8996/include/linux/msm_kgsl.h
          mkdir -p $HOME/android/lineage/kernel/samsung/msm8996/include/sound
          touch $HOME/android/lineage/kernel/samsung/msm8996/include/sound/audio_effects.h
          mkdir -p $HOME/android/lineage/out/soong/.intermediates/vendor/lineage/build/soong/generated_kernel_includes/gen/usr/include/sound
          touch $HOME/android/lineage/out/soong/.intermediates/vendor/lineage/build/soong/generated_kernel_includes/gen/usr/include/sound/audio_effects.h
          mkdir -p $HOME/android/lineage/device/samsung/hero2qltechn/prebuilt
          mkdir -p $HOME/android/lineage/out/target/product/hero2qltechn/obj/KERNEL_OBJ/arch/arm64/boot
          curl -L "https://github.com/travismills82/android_kernel_samsung_msm8996/releases/download/hero2qltechn/Image.gz-dtb" \
            -o $HOME/android/lineage/device/samsung/hero2qltechn/prebuilt/kernel || true
          if [ -f "$HOME/android/lineage/device/samsung/hero2qltechn/prebuilt/kernel" ]; then
            cp $HOME/android/lineage/device/samsung/hero2qltechn/prebuilt/kernel \
              $HOME/android/lineage/out/target/product/hero2qltechn/obj/KERNEL_OBJ/arch/arm64/boot/Image.gz-dtb
          fi

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-hero2qltechn-${{ github.sha }}
          restore-keys: |
            ccache-hero2qltechn-

      - name: Build LineageOS 17.1
        run: |
          cd $HOME/android/lineage
          export USE_CCACHE=1
          export CCACHE_EXEC=$(which ccache)
          export CCACHE_DIR=$HOME/.ccache
          ccache -M 10G
          export ALLOW_MISSING_DEPENDENCIES=true
          rm -rf $HOME/android/lineage/hardware/qcom-caf/msm8996/display
          rm -rf $HOME/android/lineage/external/ant-wireless
          rm -rf $HOME/android/lineage/device/samsung/hero2qltechn/sepolicy
          sed -i '/Updater/d' $HOME/android/lineage/vendor/lineage/config/common_full_phone.mk || true
          source build/envsetup.sh
          breakfast hero2qltechn ${{ github.event.inputs.build_type }}
          python3 -c "
          import os
          f = os.path.expanduser('~') + '/android/lineage/out/soong/build.ninja'
          if os.path.exists(f):
              c = open(f).read()
              n = c.replace('--runtime-arg -Xms --runtime-arg -Xmx','--runtime-arg -Xms64m --runtime-arg -Xmx512m')
              open(f,'w').write(n)
          " 2>/dev/null || true
          mka bacon -j$(nproc)

      - name: Upload ROM
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LineageOS-17.1-hero2qltechn-${{ github.run_number }}
          path: |
            ${{ env.HOME }}/android/lineage/out/target/product/hero2qltechn/lineage-*.zip
            ${{ env.HOME }}/android/lineage/out/target/product/hero2qltechn/recovery.img
          retention-days: 7

      - name: Upload error log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-error-log-${{ github.run_number }}
          path: ${{ env.HOME }}/android/lineage/out/error.log
          retention-days: 3